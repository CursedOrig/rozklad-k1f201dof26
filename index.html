<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розклад — К1F201ДОФ26</title>
<style>
:root{color-scheme:dark;--bg:#050a14;--panel:#0b1424;--line:#1b3150;--text:#edf5ff;--muted:#8fa7c7;--accent:#55aaff;--accent2:#1677ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#0b1d36 0%,var(--bg) 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:clamp(22px,4vw,32px);margin:0}.sub{color:var(--muted);margin-top:5px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#0d2039;color:var(--text);border:1px solid #24466e;border-radius:10px;padding:9px 12px;cursor:pointer;transition:background .18s,border-color .18s}button:hover{border-color:var(--accent);background:#12315a}#period{color:var(--muted);font-size:13px;min-width:160px;text-align:center}.status{color:var(--muted);font-size:13px;margin:8px 0 16px}.day{background:linear-gradient(145deg,#0b1628,#08111f);border:1px solid var(--line);border-radius:15px;margin:12px 0;overflow:hidden;box-shadow:0 8px 24px #0003}.dayhead{padding:12px 15px;background:#0d1d33;border-bottom:1px solid var(--line);font-weight:700;text-transform:capitalize}.lesson{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}.lesson:last-child{border-bottom:0}.time{color:var(--accent);font-weight:700;white-space:nowrap}.subject{font-weight:650}.meta{color:var(--muted);font-size:13px;margin-top:5px}.meta a{color:#75bdff}.empty{padding:18px;color:var(--muted)}footer{color:#77718e;font-size:12px;margin-top:20px;text-align:center}a{overflow-wrap:anywhere}@media(max-width:480px){body{padding:12px}.lesson{grid-template-columns:82px 1fr;gap:8px;padding:12px 10px}.time{font-size:13px}}
</style></head>
<body><main><div class="top"><div><h1>🌌 Розклад занять</h1><div class="sub">К1F201ДОФ26 · Інженерія програмного забезпечення</div></div><div class="controls"><button id="prev" aria-label="Попередній тиждень">←</button><div id="period">Завантаження…</div><button id="next" aria-label="Наступний тиждень">→</button><button id="today">Цей тиждень</button></div></div><div class="status" id="status">Завантажую розклад…</div><div id="schedule"></div><footer>Дані автоматично завантажуються з офіційного сервісу розкладу. Оновлення кожні 5 хвилин.</footer></main>
<script>
const API='https://eu-automation.xyz/api/v1/public/groups/1734/schedule';
const names=['Неділя','Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота'];
let weekOffset=0, timer;
const el=id=>document.getElementById(id);
function monday(d){const x=new Date(d);x.setHours(12,0,0,0);const wd=x.getDay();x.setDate(x.getDate()+(wd===0?-6:1-wd));return x}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmt(d){return d.toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}
function text(v){return v==null?'':String(v)}
function dateOf(s){if(!s)return '';return String(s).slice(0,10)}
// Zoom-посилання взяті з відповідних сторінок предметів у Notion.
const ZOOM_BY_SUBJECT = {
  'вступ до фаху': 'https://us02web.zoom.us/j/8513362744?pwd=AAh6N9RTK4ngH6mTbxt0gOqd5xnE1d.1',
  'основи програмування': 'https://us02web.zoom.us/j/8513362744?pwd=AAh6N9RTK4ngH6mTbxt0gOqd5xnE1d.1',
  'біологія': 'https://us02web.zoom.us/j/9489849264?pwd=QWVaNEswSWFER0tPdEN3M2RlQkV5QT09',
  'іноземна мова': 'https://us02web.zoom.us/j/7598997979?pwd=FWjSFw3MsXJdROGWXDM8kHJvxJape7.1',
  'укр. літ': 'https://us02web.zoom.us/j/5649136042?pwd=7AKGUCXa9qEIrrzgyi2AW9Faazq4KV.1',
  'українська література': 'https://us02web.zoom.us/j/5649136042?pwd=7AKGUCXa9qEIrrzgyi2AW9Faazq4KV.1',
  'укр. мова': 'https://us02web.zoom.us/j/5649136042?pwd=7AKGUCXa9qEIrrzgyi2AW9Faazq4KV.1',
  'українська мова': 'https://us02web.zoom.us/j/5649136042?pwd=7AKGUCXa9qEIrrzgyi2AW9Faazq4KV.1',
  'математика': 'https://us02web.zoom.us/j/4476740968?pwd=Q6Z86XkDbtGcICQlSayaimToQkPHb3.1',
  'фізика і астрономія': 'https://us02web.zoom.us/j/3228257238?pwd=9oI0aDqEUKBwiLKxc0PF36L2wa50Wv.1',
  'історія: україна і світ': 'https://us02web.zoom.us/j/9239352007?pwd=20YqKABnhYmhaJax2Pct2lUU7FRkNG.1',
  'історія україни і світу': 'https://us02web.zoom.us/j/9239352007?pwd=20YqKABnhYmhaJax2Pct2lUU7FRkNG.1',
  'хімія': 'https://us02web.zoom.us/j/3461015862?pwd=CRiHRuMK3JZyIjGXlMyqAtwNsgDj0r.1',
  'громадянська освіта': 'https://zoom.us/j/5290363085?pwd=Gizx71dfZAR7c4u70GllBOAxA3aQF7.1',
  'фіз. культура': 'https://us02web.zoom.us/j/6835569111?pwd=r3vXMTIv4Q2bJJt9WMTcoIv9CRI5wT.1',
  'фізична культура': 'https://us02web.zoom.us/j/6835569111?pwd=r3vXMTIv4Q2bJJt9WMTcoIv9CRI5wT.1',
  'основи медичних знань': 'https://us04web.zoom.us/j/7145022496?pwd=qM05iAcQIxHfHN2o7nw7ViYzjgv6zL.1',
  'захист україни': 'https://us02web.zoom.us/j/6579491375?pwd=YXgySHJnTEViMFoxakRVZUJuQ282UT09',
  'географія': 'https://us02web.zoom.us/j/2223733112?pwd=nosthZba7l0pRELM5rUkQXbetUwo1v.1',
  'зарубіжна література': 'https://us02web.zoom.us/j/3648117186?pwd=cW9kTUxCVHBSbjRLVTQ4dWhGSkZFUT09'
};
function normalizeSubject(value){return String(value||'').toLocaleLowerCase('uk-UA').replace(/[’']/g,'').replace(/\s+/g,' ').trim()}
function lessonOnlineUrl(l){
  // Спочатку шукаємо Zoom-посилання в даних саме цього уроку.
  const keys=['zoomLink','zoomUrl','meetingUrl','meetingLink','onlineLink','onlineUrl','conferenceUrl','conferenceLink','url'];
  const candidates=[];
  for(const key of keys){const v=l?.[key];if(typeof v==='string'&&v.trim())candidates.push(v.trim());else if(v&&typeof v==='object'){for(const k of ['url','link','href'])if(typeof v[k]==='string'&&v[k].trim())candidates.push(v[k].trim())}}
  for(const v of candidates){try{const u=new URL(v,location.href);if((u.protocol==='https:'||u.protocol==='http:')&&/(^|\.)zoom\.(us|com)$/i.test(u.hostname))return u.href}catch{}}
  // Якщо API не містить Zoom, беремо Zoom цього предмета з Notion.
  const subject=normalizeSubject(l?.discipline);
  if(!subject)return '';
  if(ZOOM_BY_SUBJECT[subject])return ZOOM_BY_SUBJECT[subject];
  for(const [name,url] of Object.entries(ZOOM_BY_SUBJECT))if(subject.includes(name)||name.includes(subject))return url;
  return '';
}
async function load(){const start=monday(new Date());start.setDate(start.getDate()+weekOffset*7);const end=new Date(start);end.setDate(end.getDate()+6);el('period').textContent=`${fmt(start)} — ${fmt(end)} ${end.getFullYear()}`;el('status').textContent='Оновлюю дані…';
try{const r=await fetch(`${API}?from=${iso(start)}&to=${iso(end)}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const json=await r.json();const lessons=Array.isArray(json)?json:(json.lessons||json.schedule||json.data||[]);render(lessons,start,end);el('status').textContent=`Група К1F201ДОФ26 · ${lessons.length} пар · оновлено ${new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}`;}catch(e){el('status').textContent='Не вдалося завантажити розклад. Спробуйте оновити сторінку.';el('schedule').innerHTML='<div class="day"><div class="empty">Помилка завантаження даних. Перевірте підключення або доступність сервісу розкладу.</div></div>';}}
function render(lessons,start,end){const root=el('schedule');root.innerHTML='';const days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));for(const d of days){const key=iso(d);const list=lessons.filter(x=>dateOf(x.date)===key).sort((a,b)=>(Number(a.lessonNumber)||0)-(Number(b.lessonNumber)||0)||text(a.startTime).localeCompare(text(b.startTime)));const card=document.createElement('section');card.className='day';const head=document.createElement('div');head.className='dayhead';head.textContent=`${names[d.getDay()]}, ${fmt(d)}`;card.appendChild(head);if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Пар немає';card.appendChild(empty)}else for(const l of list){const row=document.createElement('div');row.className='lesson';const time=document.createElement('div');time.className='time';time.textContent=`${text(l.startTime)||'—'}–${text(l.endTime)||'—'}`;const info=document.createElement('div');const subject=document.createElement('div');subject.className='subject';subject.textContent=text(l.discipline)||'Заняття';info.appendChild(subject);const bits=[l.typeLabel||l.typeShort||l.type,l.teacherDisplay||((Array.isArray(l.teachers)?l.teachers:[]).map(t=>typeof t==='string'?t:(t.name||t.fullName||'')).filter(Boolean).join(', ')),l.classroom].filter(Boolean);if(bits.length){const meta=document.createElement('div');meta.className='meta';meta.textContent=bits.join(' · ');info.appendChild(meta)}const onlineUrl=lessonOnlineUrl(l);if(onlineUrl){const meta=document.createElement('div');meta.className='meta';const a=document.createElement('a');a.href=onlineUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Відкрити Zoom цього заняття';meta.appendChild(a);info.appendChild(meta)}row.append(time,info);card.appendChild(row)}root.appendChild(card)}}
el('prev').onclick=()=>{weekOffset--;load()};el('next').onclick=()=>{weekOffset++;load()};el('today').onclick=()=>{weekOffset=0;load()};load();timer=setInterval(load,300000);
</script></body></html>
