<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Розклад — К1F201ДОФ26</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--panel:#12121c;--line:#29263d;--text:#f3f0ff;--muted:#a9a2c2;--accent:#a78bfa;--accent2:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
main{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:clamp(22px,4vw,32px);margin:0}.sub{color:var(--muted);margin-top:5px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#211b35;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--accent)}#period{color:var(--muted);font-size:13px;min-width:160px;text-align:center}.status{color:var(--muted);font-size:13px;margin:8px 0 16px}.day{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin:12px 0;overflow:hidden}.dayhead{padding:12px 15px;background:#171426;border-bottom:1px solid var(--line);font-weight:700;text-transform:capitalize}.lesson{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}.lesson:last-child{border-bottom:0}.time{color:var(--accent);font-weight:700;white-space:nowrap}.subject{font-weight:650}.meta{color:var(--muted);font-size:13px;margin-top:5px}.meta a{color:#c4b5fd}.empty{padding:18px;color:var(--muted)}footer{color:#77718e;font-size:12px;margin-top:20px;text-align:center}a{overflow-wrap:anywhere}@media(max-width:480px){body{padding:12px}.lesson{grid-template-columns:82px 1fr;gap:8px;padding:12px 10px}.time{font-size:13px}}
</style></head>
<body><main><div class="top"><div><h1>🌌 Розклад занять</h1><div class="sub">К1F201ДОФ26 · Інженерія програмного забезпечення</div></div><div class="controls"><button id="prev" aria-label="Попередній тиждень">←</button><div id="period">Завантаження…</div><button id="next" aria-label="Наступний тиждень">→</button><button id="today">Цей тиждень</button></div></div><div class="status" id="status">Завантажую розклад…</div><div id="schedule"></div><footer>Дані автоматично завантажуються з офіційного сервісу розкладу. Оновлення кожні 5 хвилин.</footer></main>
<script>
const API='https://eu-automation.xyz/api/v1/public/groups/1734/schedule';
const names=['Неділя','Понеділок','Вівторок','Середа','Четвер','П’ятниця','Субота'];
let weekOffset=0, timer;
const el=id=>document.getElementById(id);
function monday(d){const x=new Date(d);x.setHours(12,0,0,0);const wd=x.getDay();x.setDate(x.getDate()+(wd===0?-6:1-wd));return x}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmt(d){return d.toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}
function text(v){return v==null?'':String(v)}
function dateOf(s){if(!s)return '';return String(s).slice(0,10)}
async function load(){const start=monday(new Date());start.setDate(start.getDate()+weekOffset*7);const end=new Date(start);end.setDate(end.getDate()+6);el('period').textContent=`${fmt(start)} — ${fmt(end)} ${end.getFullYear()}`;el('status').textContent='Оновлюю дані…';
try{const r=await fetch(`${API}?from=${iso(start)}&to=${iso(end)}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const json=await r.json();const lessons=Array.isArray(json)?json:(json.lessons||json.schedule||json.data||[]);render(lessons,start,end);el('status').textContent=`Група К1F201ДОФ26 · ${lessons.length} пар · оновлено ${new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}`;}catch(e){el('status').textContent='Не вдалося завантажити розклад. Спробуйте оновити сторінку.';el('schedule').innerHTML='<div class="day"><div class="empty">Помилка завантаження даних. Перевірте підключення або доступність сервісу розкладу.</div></div>';}}
function render(lessons,start,end){const root=el('schedule');root.innerHTML='';const days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));for(const d of days){const key=iso(d);const list=lessons.filter(x=>dateOf(x.date)===key).sort((a,b)=>(Number(a.lessonNumber)||0)-(Number(b.lessonNumber)||0)||text(a.startTime).localeCompare(text(b.startTime)));const card=document.createElement('section');card.className='day';const head=document.createElement('div');head.className='dayhead';head.textContent=`${names[d.getDay()]}, ${fmt(d)}`;card.appendChild(head);if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Пар немає';card.appendChild(empty)}else for(const l of list){const row=document.createElement('div');row.className='lesson';const time=document.createElement('div');time.className='time';time.textContent=`${text(l.startTime)||'—'}–${text(l.endTime)||'—'}`;const info=document.createElement('div');const subject=document.createElement('div');subject.className='subject';subject.textContent=text(l.discipline)||'Заняття';info.appendChild(subject);const bits=[l.typeLabel||l.typeShort||l.type,l.teacherDisplay||((Array.isArray(l.teachers)?l.teachers:[]).map(t=>typeof t==='string'?t:(t.name||t.fullName||'')).filter(Boolean).join(', ')),l.classroom].filter(Boolean);if(bits.length){const meta=document.createElement('div');meta.className='meta';meta.textContent=bits.join(' · ');info.appendChild(meta)}if(l.onlineLink){const meta=document.createElement('div');meta.className='meta';const a=document.createElement('a');a.href=l.onlineLink;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Посилання на онлайн-заняття';meta.appendChild(a);info.appendChild(meta)}row.append(time,info);card.appendChild(row)}root.appendChild(card)}}
el('prev').onclick=()=>{weekOffset--;load()};el('next').onclick=()=>{weekOffset++;load()};el('today').onclick=()=>{weekOffset=0;load()};load();timer=setInterval(load,300000);
</script></body></html>
